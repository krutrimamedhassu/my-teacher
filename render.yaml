services:
  # ── Backend ──────────────────────────────────────────────────────────────────
  - type: web
    name: my-teacher-backend
    runtime: python
    rootDir: my-t-backend-services
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_ENV
        value: prod
      - key: PROJECT_NAME
        value: AI Teacher
      - key: API_PREFIX
        value: /api
      - key: TITLE_OF_THE_PROJECT
        value: AI Teacher API
      - key: DESCRIPTION_OF_THE_PROJECT
        value: Backend API for AI Teacher - Your AI-powered teaching assistant
      - key: VERSION
        value: 0.1.0
      - key: DEFAULT_MODEL
        value: gpt-4.1
      - key: EMBEDDING_MODEL
        value: text-embedding-ada-002
      - key: VECTOR_STORE_PATH
        value: ./vector_store
      - key: MAX_DOCUMENT_SIZE_MB
        value: 10
      - key: ALLOWED_DOCUMENT_TYPES
        value: '["pdf", "txt", "docx", "html"]'
      - key: LOG_LEVEL
        value: info
      - key: BACKEND_CORS_ORIGINS
        value: https://my-teacher-frontend.onrender.com
      # ⚠️ Set these secrets manually in the Render dashboard (do NOT hardcode):
      - key: OPENAI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_TEST_DB
        sync: false
      - key: DOCUMENT_STORE_INVOKER_URL
        sync: false
      - key: LOGFIRE_TOKEN
        sync: false

  # ── Frontend ─────────────────────────────────────────────────────────────────
  - type: web
    name: my-teacher-frontend
    runtime: static
    rootDir: my-t-frontend-services
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: https://my-teacher-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
